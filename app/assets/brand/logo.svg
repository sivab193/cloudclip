<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.5" stop-color="#0A7EA4"/>
      <stop offset="1" stop-color="#075985"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" rx="225" fill="url(#bg)"/>

  <!-- Cloud silhouette: overlapping lobes unioned by a shared fill. -->
  <g fill="#FFFFFF">
    <rect x="180" y="545" width="664" height="200" rx="100"/>
    <circle cx="360" cy="520" r="142"/>
    <circle cx="530" cy="452" r="190"/>
    <circle cx="712" cy="536" r="132"/>
  </g>

  <!-- Clipboard sitting in the cloud: board + clip tab. -->
  <g fill="#0A5E7A">
    <rect x="410" y="500" width="212" height="218" rx="34"/>
    <rect x="456" y="464" width="120" height="58" rx="22"/>
  </g>
  <g fill="#FFFFFF">
    <rect x="446" y="574" width="140" height="24" rx="12"/>
    <rect x="446" y="626" width="94" height="24" rx="12"/>
  </g>
</svg>
