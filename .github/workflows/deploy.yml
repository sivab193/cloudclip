name: Backend CI & Deploy
permissions:
  contents: read
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: false

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy.yml'
  pull_request:
    paths:
      - 'backend/**'

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm audit --audit-level=moderate

  deploy:
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    environment: production
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.GCE_HOST }}
          username: ${{ secrets.GCE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ~/cloudclip
            git fetch origin main
            git merge --ff-only ${{ github.sha }}
            test "$(git rev-parse HEAD)" = "${{ github.sha }}"
            cd backend
            # Build first, then swap containers — avoids the old down/up gap
            docker compose up -d --build
            echo "Backend deploy complete at $(date)"

      - name: Post-deploy health check
        run: |
          sleep 20
          curl -fsS https://cc-api.siv19.dev/health
