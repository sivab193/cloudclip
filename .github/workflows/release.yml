name: Build Release Apps

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub Release tag to receive the artifacts
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825a76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build:mac
      - name: Attach macOS builds to the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$RELEASE_TAG" dist/CloudClip-*-arm64.dmg dist/CloudClip-*-arm64-mac.zip --clobber

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_API_URL: https://api-us.cclip.cc
      EXPO_PUBLIC_WEB_URL: https://us.cclip.cc
      EXPO_PUBLIC_DEPLOYMENT_MODE: regional
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825a76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --runInBand
      - name: Require Expo build authentication
        run: test -n "$EXPO_TOKEN" || (echo "Add EXPO_TOKEN as a GitHub Actions secret." && exit 1)
      - name: Build signed APK with EAS
        run: npx eas-cli@16.28.0 build --platform android --profile preview --non-interactive --wait --json > eas-build.json
      - name: Download APK
        run: |
          APK_URL=$(node -e "const b=require('./eas-build.json'); const x=Array.isArray(b)?b[0]:b; process.stdout.write(x.artifacts.buildUrl)")
          curl --fail --location "$APK_URL" --output CloudClip-android.apk
      - name: Attach Android APK to the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$RELEASE_TAG" CloudClip-android.apk --clobber
