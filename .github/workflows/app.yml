name: App CI
on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/app.yml']
  pull_request:
    paths: ['app/**', '.github/workflows/app.yml']
permissions:
  contents: read
jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    # Build-only public configuration. CI never signs in or touches user data.
    env:
      EXPO_PUBLIC_API_URL: https://cc-api.siv19.dev
      EXPO_PUBLIC_WEB_URL: https://cc.siv19.dev
      EXPO_PUBLIC_FIREBASE_API_KEY: ci-build-only-api-key
      EXPO_PUBLIC_FIREBASE_PROJECT_ID: cloudclip-ci
      EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: cloudclip-ci.firebaseapp.com
      EXPO_PUBLIC_FIREBASE_APP_ID: 1:123456789:web:ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --runInBand
      - run: npm audit --audit-level=moderate
      - run: npx expo install --check
      - run: npm run check:release
      - run: npm run build:web
      - run: npx expo export --platform android --output-dir dist-android
